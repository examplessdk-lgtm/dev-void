packages:
  - docs
  - packages/*
  - playground/*
  - playground-local/*

catalog:
  '@clack/prompts': ^1.3.0
  '@cloudflare/workers-types': ^4.20260506.1
  '@types/node': ^25.6.0
  '@typescript/native-preview': 7.0.0-dev.20260505.1
  pathe: ^2.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.1.20
  wrangler: ^4.88.0
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.20
  vite-plus: ^0.1.20

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - workerd

overrides:
  esbuild: ^0.27.3
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
