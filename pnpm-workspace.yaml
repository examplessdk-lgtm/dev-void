packages:
  - docs
  - packages/*
  - playground/*
  - playground-local/*

catalogMode: strict

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@clack/prompts': ^1.8.0
  '@cloudflare/workers-types': ^4.20260702.1
  '@types/node': ^26.5.1
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a
  vite-plus: 0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a
  wrangler: 4.107.0

catalogs:
  angular:
    typescript: 6.0.3
  sveltekit:
    typescript: 6.0.3

packageExtensions:
  '@analogjs/vite-plugin-angular@2.7.2':
    peerDependencies:
      typescript: '>=6.0 <6.1'

overrides:
  esbuild: ^0.27.3
  react-server-dom-webpack: 19.2.7
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-darwin-x64@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a'
  - vite-plus@0.0.0-commit.0e24d6c2139ea8733ee4a1dd70e4a2a1ba8b4a4a
