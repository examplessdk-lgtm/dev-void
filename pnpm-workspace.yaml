packages:
  - docs
  - packages/*
  - platform
  - platform/packages/*
  - playground/*
  - playground-local/*

catalogMode: strict

allowBuilds:
  '@astryxdesign/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  # Stays on 4.x on purpose: Wrangler lists workers-types ^5 as an OPTIONAL peer, and
  # every 5.x since 5.20260807.2 declares global `Buffer`/`process` as `any`, which collides
  # with `@types/node` under packages/void's `types: ["node", "@cloudflare/workers-types"]`
  # (Buffer loses its members; ~30 typecheck errors). Revisit when upstream drops those globals.
  '@cloudflare/workers-types': ^5.0.0
  '@types/node': ^26.6.3
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.2
  wrangler: 4.144.0
  cf: 1.0.0-beta.9
  oauth4webapi: ^3.8.8
  '@astryxdesign/core': 0.6.3
  '@astryxdesign/theme-neutral': 0.6.3
  '@stylexjs/stylex': 0.19.1

catalogs:
  angular:
    typescript: 7.0.2
  platform:
    '@cloudflare/workers-types': ^5.20260929.1
    hono: 4.13.11
    wrangler: ^4.144.0
  sveltekit:
    typescript: 7.0.2

packageExtensions:
  '@analogjs/vite-plugin-angular@2.7.5':
    peerDependencies:
      typescript: '>=6.0 <6.1'

overrides:
  # Keep Vite+'s pinned Vitest internals on the same patch as the runner.
  '@vitest/browser': 5.0.2
  '@vitest/browser-preview': 5.0.2
  '@vitest/mocker': 5.0.2
  '@vitest/pretty-format': 5.0.2
  '@vitest/snapshot': 5.0.2
  '@vitest/spy': 5.0.2
  '@vitest/utils': 5.0.2
  esbuild: ^0.28.2
  react-server-dom-webpack: 19.3.0
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

minimumReleaseAgeExclude:
  - '@nkzw/*'
  - '@void/*'
  - cf
  - react-fate
  - void
  - void-fate
  # Required by cf beta 9; keep these exceptions limited to its exact dependency releases.
  - '@cloudflare/build-output-utils@0.8.4'
  - '@cloudflare/codemods@0.3.0'
  - '@cloudflare/config@0.22.0'
  - '@cloudflare/runtime-types@0.1.6'
  - '@cloudflare/workerd-darwin-64@1.20260930.2'
  - '@cloudflare/workerd-darwin-arm64@1.20260930.2'
  - '@cloudflare/workerd-linux-64@1.20260930.2'
  - '@cloudflare/workerd-linux-arm64@1.20260930.2'
  - '@cloudflare/workerd-windows-64@1.20260930.2'
  - 'miniflare@5.20260930.0-alpha'
  - 'workerd@1.20260930.2'
