packages:
  - docs
  - packages/*
  - playground/*
  - playground-local/*

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@clack/prompts': ^1.3.0
  '@cloudflare/workers-types': ^4.20260508.1
  '@types/node': ^25.6.2
  '@typescript/native-preview': 7.0.0-dev.20260507.1
  pathe: ^2.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.1.20
  vite-plus: ^0.1.20
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.20
  wrangler: ^4.90.0

overrides:
  esbuild: ^0.27.3
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
