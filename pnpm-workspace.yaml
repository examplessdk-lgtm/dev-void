packages:
  - docs
  - packages/*
  - platform
  - platform/packages/*
  - playground/*
  # Dependencies for the Kit 2 compatibility test; app source comes from the Kit 3 playground.
  - test/fixtures/sveltekit-v2

catalogMode: strict

allowBuilds:
  '@astryxdesign/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: false
  sharp: false
  vue-demi: false
  workerd: true

catalog:
  '@cloudflare/workers-types': ^5.20261009.1
  '@types/node': ^26.6.4
  '@voidzero-dev/vite-plus-prompts': 1.1.0
  typescript: 7.0.2
  '@voidzero-dev/vitepress-theme': ^5.0.7
  pathslash: ^0.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
  wrangler: ^4.149.0
  cf: ^1.0.0-beta.14
  oauth4webapi: ^3.8.8
  '@astryxdesign/core': 0.6.5
  '@astryxdesign/theme-neutral': 0.6.5
  '@stylexjs/stylex': 0.19.1
  '@angular/build': ^22.2.2
  '@astrojs/cloudflare': ^14.3.4
  '@cloudflare/build-output-utils': ^0.9.0
  '@cloudflare/codemods': ^0.4.2
  '@cloudflare/config': ^0.24.1
  '@cloudflare/vite-plugin': ^1.63.1
  '@cloudflare/workers-auth': ^0.13.1
  '@nkzw/fate': 1.7.7
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-rsc': ^0.5.36
  astro: ^7.3.7
  magic-string: ^1.4.3
  miniflare: 5.20261006.1-alpha
  nuxt: ^4.6.0
  playwright: ^1.64.0
  postal-mime: ^4.0.5
  react-fate: 1.7.7
  reka-ui: 2.11.0
  rolldown: ^1.2.13
  solid-js: ^1.9.17
  svelte: ^5.57.2

catalogs:
  angular:
    typescript: 6.0.3
  platform:
    '@cloudflare/workers-types': ^5.20261009.1
    hono: 4.13.13
    wrangler: ^4.149.0
  sveltekit:
    typescript: 6.0.3

packageExtensions:
  '@analogjs/vite-plugin-angular@2.8.0':
    peerDependencies:
      typescript: '>=6.0 <6.1'

overrides:
  # Keep Vite+'s pinned Vitest internals on the same patch as the runner.
  '@vitest/browser': 5.0.3
  '@vitest/browser-preview': 5.0.3
  '@vitest/mocker': 5.0.3
  '@vitest/pretty-format': 5.0.3
  '@vitest/snapshot': 5.0.3
  '@vitest/spy': 5.0.3
  '@vitest/utils': 5.0.3
  esbuild: ^0.28.2
  react-server-dom-webpack: 19.3.0
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    tailwindcss: '*'
    vite: '*'

minimumReleaseAgeExclude:
  - '@cloudflare/*'
  - '@nkzw/*'
  - '@void/*'
  - '@voidzero-dev/*'
  - 'miniflare'
  - 'workerd'
  - 'wrangler'
  - cf
  - hono
  - react-fate
  - void
  - void-fate

patchedDependencies:
  # Remove when upgrading to the next prompts release containing the one-space output fix.
  '@voidzero-dev/vite-plus-prompts@1.1.0': patches/@voidzero-dev__vite-plus-prompts@1.1.0.patch
