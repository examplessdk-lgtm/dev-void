name: Deploy Platform Production

on:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    if: ${{ vars.VOID_PLATFORM_DEPLOY_ENABLED == 'true' }}
    uses: ./.github/workflows/platform-ci.yml
    permissions:
      contents: read

  deploy:
    if: ${{ vars.VOID_PLATFORM_DEPLOY_ENABLED == 'true' }}
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: Prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          node-version-file: .node-version
      - run: vp run --filter @voidcloud/platform deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
