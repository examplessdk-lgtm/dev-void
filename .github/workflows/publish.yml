name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  PUBLISH_TARGET: github-packages

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip_windows: true

  publish:
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
      - id: publish-config
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$PUBLISH_TARGET" = "npm" ]; then
            echo "registry_url=https://registry.npmjs.org" >> "$GITHUB_OUTPUT"
            echo "publish_args=--provenance --access public" >> "$GITHUB_OUTPUT"
            echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"
          else
            echo "registry_url=https://npm.pkg.github.com" >> "$GITHUB_OUTPUT"
            echo "publish_args=--access restricted" >> "$GITHUB_OUTPUT"
            echo "NODE_AUTH_TOKEN=$GH_PACKAGES_TOKEN" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          registry-url: ${{ steps.publish-config.outputs.registry_url }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm --filter ./packages/void publish ${{ steps.publish-config.outputs.publish_args }} --no-git-checks
      - run: pnpm --filter ./packages/md publish ${{ steps.publish-config.outputs.publish_args }} --no-git-checks
      - run: pnpm --filter ./packages/react publish ${{ steps.publish-config.outputs.publish_args }} --no-git-checks
      - run: pnpm --filter ./packages/vue publish ${{ steps.publish-config.outputs.publish_args }} --no-git-checks
      - run: pnpm --filter ./packages/svelte publish ${{ steps.publish-config.outputs.publish_args }} --no-git-checks
      - run: pnpm --filter ./packages/solid publish ${{ steps.publish-config.outputs.publish_args }} --no-git-checks
