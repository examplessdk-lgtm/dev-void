name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      skip_windows:
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # No Cloudflare creds in this job. The credentialed live deploy e2e runs in the separate
    # `live-e2e` job (below), whose secrets are bound to the `cloudflare-e2e` environment. Here the
    # live suite (part of `vp run test:all`) sees empty creds and self-skips on every event.
    strategy:
      fail-fast: false
      matrix:
        # Windows runs on main pushes and on PRs labeled "test: windows",
        # unless a reusable workflow caller explicitly disables it.
        os: '${{ (((github.event_name == ''push'' && startsWith(github.ref, ''refs/heads/'')) || contains(github.event.pull_request.labels.*.name, ''test: windows'')) && !(github.event_name == ''workflow_call'' && inputs.skip_windows)) && fromJSON(''["blacksmith-4vcpu-ubuntu-2404","windows-latest"]'') || fromJSON(''["blacksmith-4vcpu-ubuntu-2404"]'') }}'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          cache: true

      - run: vp exec playwright install --with-deps chromium
        if: ${{ !contains(matrix.os, 'windows') }}

      - run: vp exec playwright install chromium
        if: ${{ contains(matrix.os, 'windows') }}

      - run: vp run test:all

  # Credentialed live Cloudflare deploy e2e, ISOLATED from `test` so the account token exists ONLY in
  # a job bound to the `cloudflare-e2e` GitHub Environment. That environment's deployment branch policy
  # allows `main` ONLY and the ref is enforced server-side, so a `pull_request` run (ref
  # refs/pull/<n>/merge) can never reach the secret — even a PR that edits this file — and a modified
  # workflow cannot exfiltrate it. The `if` also keeps the job off everything except a direct push to
  # the `main` branch: tag pushes and `workflow_call` (release) carry a non-main ref, so they are
  # skipped — which both avoids a branch-policy failure and matches where the secret is allowed, and
  # it is scoped to the canonical repo so forks don't run it. It deploys a UNIQUELY-named worker
  # (VOID_E2E_RUN_ID) to a throwaway account and tears it down. A preflight step fails the job when a
  # credential is empty (unset / deleted / not-yet-rotated token), so a missing secret can never turn
  # the live-deploy gate into a silent green no-op (the `test` job's uncredentialed run still skips).
  live-e2e:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'voidzero-dev/void' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    environment: cloudflare-e2e
    env:
      VOID_E2E_CF_TOKEN: ${{ secrets.VOID_E2E_CF_TOKEN }}
      VOID_E2E_CF_ACCOUNT_ID: ${{ secrets.VOID_E2E_CF_ACCOUNT_ID }}
      VOID_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          cache: true
      # Fail closed BEFORE the build: a missing/empty credential must fail this job, not self-skip. The
      # `${VAR:?}` expansion exits nonzero when the secret is unset OR empty (GitHub resolves an unset
      # secret to '').
      - name: Require live Cloudflare credentials
        run: |
          : "${VOID_E2E_CF_TOKEN:?empty — set it as a cloudflare-e2e environment secret}"
          : "${VOID_E2E_CF_ACCOUNT_ID:?empty — set it as a cloudflare-e2e environment secret}"
      # build:core produces dist/cli/cli.mjs + the built `void` plugin the deploy uses to build the app.
      - run: vp run build:core
      - run: vp test run packages/void/test/e2e/cloudflare-deploy-live.test.ts

  done:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - live-e2e
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
