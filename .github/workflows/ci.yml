name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      skip_windows:
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # The gated live Cloudflare deploy e2e (packages/void/test/e2e/cloudflare-deploy-live.test.ts)
      # activates only when BOTH vars are non-empty. Same-repo pushes/PRs receive the secrets; fork
      # PRs receive empty strings, so the suite SKIPS there. Each run deploys a UNIQUELY-named worker
      # (VOID_E2E_RUN_ID) and tears it down, so overlapping runs never collide on the same worker/D1/KV.
      # NOTE: only `github.*` (and `secrets.*`) are valid in a job-level `env` map. `strategy.job-index`
      # is NOT — referencing it silently voids the ENTIRE map (every var becomes empty, no error), which
      # is why an earlier `run-id + attempt + strategy.job-index` value made the token empty and the e2e
      # skip. run-id + attempt is already unique per deploying run: windows skips the live path, so only
      # the single ubuntu leg ever deploys.
      VOID_E2E_CF_TOKEN: ${{ secrets.VOID_E2E_CF_TOKEN }}
      VOID_E2E_CF_ACCOUNT_ID: ${{ secrets.VOID_E2E_CF_ACCOUNT_ID }}
      VOID_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs on main pushes and on PRs labeled "test: windows",
        # unless a reusable workflow caller explicitly disables it.
        os: '${{ (((github.event_name == ''push'' && startsWith(github.ref, ''refs/heads/'')) || contains(github.event.pull_request.labels.*.name, ''test: windows'')) && !(github.event_name == ''workflow_call'' && inputs.skip_windows)) && fromJSON(''["blacksmith-4vcpu-ubuntu-2404","windows-latest"]'') || fromJSON(''["blacksmith-4vcpu-ubuntu-2404"]'') }}'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version-file: .node-version
          cache: true

      - run: vp exec playwright install --with-deps chromium
        if: ${{ !contains(matrix.os, 'windows') }}

      - run: vp exec playwright install chromium
        if: ${{ contains(matrix.os, 'windows') }}

      - run: vp run test:all

  done:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
