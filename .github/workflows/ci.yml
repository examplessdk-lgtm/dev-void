name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      skip_windows:
        type: boolean
        required: false
        default: false

jobs:
  lint-and-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:all
      - run: pnpm check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs on main pushes and on PRs labeled "test: windows",
        # unless a reusable workflow caller explicitly disables it.
        os: '${{ (((github.event_name == ''push'' && startsWith(github.ref, ''refs/heads/'')) || contains(github.event.pull_request.labels.*.name, ''test: windows'')) && !(github.event_name == ''workflow_call'' && inputs.skip_windows)) && fromJSON(''["blacksmith-4vcpu-ubuntu-2404","windows-latest"]'') || fromJSON(''["blacksmith-4vcpu-ubuntu-2404"]'') }}'
        suite: [unit, core-markdown, metaframeworks, pages-react-vue, pages-svelte-solid]
        include:
          - suite: unit
            script: test:unit
          - suite: core-markdown
            script: test:integration
          - suite: metaframeworks
            script: test:metaframeworks
            retry: 2
          - suite: pages-react-vue
            script: test:pages:react-vue
            retry: 2
          - suite: pages-svelte-solid
            script: test:pages:svelte-solid
            retry: 2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium
        if: matrix.suite != 'unit' && !contains(matrix.os, 'windows')

      - run: pnpm exec playwright install chromium
        if: matrix.suite != 'unit' && contains(matrix.os, 'windows')

      - run: pnpm ${{ matrix.script }}${{ matrix.retry && format(' --retry {0}', matrix.retry) || '' }}

  done:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-and-check
      - test
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
