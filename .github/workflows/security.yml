name: Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: oxc-project/security-action@d94d8a04d0cfe578a32d61ee2bff7e2891049704 # v1.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
